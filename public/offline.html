<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sift - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: #0B0E1A;
        color: #F1EEE6;
        padding: 1.5rem;
      }
      .card {
        max-width: 32rem;
        padding: 1.5rem;
        border-radius: 1rem;
        background: #171D33;
        border: 1px solid #2A3150;
        text-align: center;
      }
      h1 { margin: 0 0 0.5rem; }
      p { color: #8B93AC; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>The app shell is available, but the live poster images and fonts can’t be fetched right now. Your saved session data still appears locally in this browser.</p>
    </div>
  </body>
</html>
